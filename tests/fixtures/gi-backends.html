import { installSpeedballGI } from '../../js/index.js';

renderer.setSize(640, 480);

  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  mesh.position.set(...pos); scene.add(mesh); return mesh;

box([6, 0.2, 6], [0, -0.1, 0]);
box([6, 4, 0.2], [0, 2, -3]);
box([0.2, 4, 6], [-3, 2, 0], new THREE.MeshStandardMaterial({ color: 0xc52016, roughness: 0.9 }));
const blocker = box([1.4, 1.8, 1.4], [0, 0.9, 0]);

  detail.position.set(1.8, 0.4, -1); scene.add(detail);
