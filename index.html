<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E4E4">
<title>SPEEDBALL GI — real-time DDGI for three.js WebGPU</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./css/dossier.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.14/build/index.module.js",
    "powershot-threejs": "https://cdn.jsdelivr.net/npm/powershot-threejs@0.8.1/src/index.js"
  },
  "scopes": {
    "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.14/": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js" }
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bootwash"></div>

<div id="ui">
  <!-- Transport: drives the centre sphere so the GI lane can be watched reacting
       to real motion rather than to a still frame. -->
  <div class="transport" id="transport">
    <div class="core-controls">
      <div class="sun-control">
        <button id="sun-ball" type="button" aria-label="Drag to set sun azimuth and elevation"><i id="sun-dot"></i></button>
        <span class="core-copy"><b>SPEEDBALL</b><small id="sun-readout">119° / 62.5°</small></span>
      </div>
      <label class="core-slider intensity-control"><span>INTENSITY <b id="intensity-value">20</b></span><input id="intensity-slider" type="range" min="0" max="40" step="0.1" value="20"></label>
      <label class="core-slider compact-core"><span>DIVISIONS <b id="divisions-value">16</b></span><input id="divisions-slider" type="range" min="2" max="32" step="1" value="16"></label>
      <label class="core-slider compact-core"><span>RAYS / PROBE <b id="rays-value">64</b></span><input id="rays-slider" type="range" min="32" max="256" step="16" value="64"></label>
    </div>
    <div class="transport-row">
      <div class="hysteresis-meter" id="hysteresis-meter">
        <span class="meter-head"><b>HYSTERESIS</b><strong id="hysteresis-value">0.60</strong></span>
        <input id="hysteresis-slider" type="range" min="0.5" max="0.99" step="0.01" value="0.6">
        <span class="meter-foot"><small id="hysteresis-state">GATED · STABLE</small><span class="seg mini" role="group" aria-label="Ray jitter mode"><button id="jitter-gated" type="button" aria-pressed="true">GATED</button><button id="jitter-mc" type="button" aria-pressed="false">MONTE CARLO</button></span></span>
      </div>
      <div class="material-switch">
        <span class="k">SPHERE MATERIAL</span>
        <div class="seg" role="group" aria-label="Centre sphere material">
          <button id="ball-emissive" type="button" aria-pressed="false" title="Emissive mesh with NEE">EMISSION</button>
          <button id="ball-metal" type="button" aria-pressed="true" title="Reflective metal">METAL</button>
        </div>
      </div>
      <div class="deck-actions">
        <button id="play" type="button" aria-pressed="false" title="Play the sphere animation">
          <i class="glyph" aria-hidden="true"></i><span class="label">ANIMATE</span>
        </button>
        <button id="gui-toggle" type="button" aria-pressed="false"><span class="num">[ ]</span><span>ADVANCED</span></button>
      </div>
    </div>
  </div>
</div>

<div id="status"><i class="reg tl"></i><i class="reg br"></i><span id="status-msg">initializing WebGPU…</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';
import { FilmPipeline, FILM_PRESETS, applyFilmPreset } from 'powershot-threejs';
import { installSpeedballGI, excludeFromGI } from './js/index.js';
import { applyGiSettings, addGiPanel } from './js/gi_settings.js';

// ── Scene ──────────────────────────────────────────────────────────────────────
// 'sun'     — Sponza's sunlit atrium: Preetham sky + directional sun.
// 'cluster' — Sponza with no sky, no sun, no ambient: a 50-point-light grid drawn
//             by the Forward+ clustered lights node, GI on its fixed
//             importance-budgeted arena.
// The scene is a URL parameter and NOT a live toggle on purpose. clusteredLighting
// is an install-time decision (the lights factory must be in place before any lit
// material compiles), so the Sponza lighting comparison reloads cleanly.
const SCENES = {
  sun:     { clustered: false },
  cluster: { clustered: true  },
};
const URL_PARAMS = new URLSearchParams(location.search);
const SCENE_MODE = SCENES[URL_PARAMS.get('scene')] ? URL_PARAMS.get('scene') : 'sun';
const CLUSTER = SCENES[SCENE_MODE].clustered;
const REFLECTION_QUALITY_VALUES = new Set(['off', 'rough', 'high', 'ultra']);
const REFLECTION_QUALITY = REFLECTION_QUALITY_VALUES.has(URL_PARAMS.get('reflections'))
  ? URL_PARAMS.get('reflections')
  : 'high';

// Scene mode and reflection quality both choose install-time GPU structure. Preserve
// the other query keys when either control reloads so the UI never resets its peer.
let structuralReloadPending = false;
let demoDisposed = false;
let disposePromise = null;
async function reloadWithStructuralSetting(name, value, defaultValue) {
  if (structuralReloadPending) return;
  structuralReloadPending = true;
  const next = new URLSearchParams(location.search);
  if (value === defaultValue) next.delete(name); else next.set(name, value);
  const search = next.toString();
  const destination = `${location.pathname}${search ? `?${search}` : ''}${location.hash}`;
  try {
    await disposeForStructuralReload();
  } finally {
    // A disposer failure must not strand the user on an inert half-torn-down page.
    location.href = destination;
  }
}

const MODEL = {
  url: './Sponza/glTF/Sponza.gltf',
  meta: 'SPONZA + PREETHAM SKY',
  hero: { cam: [1.1982, 4.5833, -3.463], target: [-3.2952, 4.4996, -3.2815] },
  ballHeight: 0.30,
};

// ── Dossier chrome handles (see css/dossier.css) ───────────────────────────────
const uiEl = document.getElementById('ui');
const statusEl = document.getElementById('status');
const statusMsgEl = document.getElementById('status-msg');
const bootWashEl = document.getElementById('bootwash');
// The plate keeps its registration crosses, so write the copy into the inner span
// rather than replacing the whole subtree.
const setStatus = (msg, err = false) => {
  if (demoDisposed) return;
  statusMsgEl.textContent = msg;
  statusEl.classList.toggle('err', err);
  statusEl.classList.remove('hide');
};
const hideStatus = () => { statusEl.classList.add('hide'); bootWashEl.classList.add('hide'); };
const onWindowError = (e) => setStatus('Error:\n' + (e.error?.stack || e.message), true);
const onUnhandledRejection = (e) => setStatus('Error:\n' + (e.reason?.stack || e.reason), true);
window.addEventListener('error', onWindowError);
window.addEventListener('unhandledrejection', onUnhandledRejection);

// ── Renderer ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
// At 4K, 4x MSAA multiplies the full-resolution scene-pass bandwidth before
// PowerShot even develops the frame. Keep the demo single-sampled by default.
const renderer = new THREE.WebGPURenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.7;
await renderer.init();
if (renderer.backend?.isWebGPUBackend !== true) {
  setStatus('WebGPU not available.\nThis demo needs a WebGPU-capable browser\n(Chrome/Edge 121+, or Firefox Nightly).', true);
  uiEl.classList.add('ready');
  throw new Error('WebGPU unavailable');
}
// Backend is up: raise the chrome and drop the drafting-grid wash. The boot plate
// stays on top of it until Sponza finishes loading.
uiEl.classList.add('ready');
bootWashEl.classList.add('hide');

// SPEEDBALL GI is installed in one call further down (installSpeedballGI), which
// wires the lights factory, the material-dirty pass, and idle-gated solving.

// ── Scene & camera ────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.05, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ── Sky (Preetham, WebGPU) + sun ──────────────────────────────────────────────
// Cluster mode is deliberately unlit from above: every photon in it comes from
// the point-light grid, so the sky, sun and fill are never added to the scene.
const sky = new SkyMesh();
sky.scale.setScalar(1500);                 // within the camera far plane (no z-precision hit)
excludeFromGI(sky);                         // keep the sky OUT of the GI BVH / auto-fit

const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;

// Tiny pre-convergence safety fill; SPEEDBALL probes carry the real sky ambient.
const hemi = new THREE.HemisphereLight(0x9fc6ff, 0x4a4036, 0.05);

if (CLUSTER) {
  scene.background = new THREE.Color(0x000000);
} else {
  scene.add(sky);
  scene.add(sun);
  scene.add(sun.target);
  scene.add(hemi);
}

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// The sun shadow is re-rendered ON DEMAND. refreshSunConsumers() flags sun edits;
// the transport sphere does not cast into this static architectural map, so its
// animation never turns the 103-caster Sponza shadow pass into per-frame work.
//
// It MUST be the light's own flag. three's WebGPU ShadowNode.updateBefore gates on
// `shadow.needsUpdate || shadow.autoUpdate` and never consults
// renderer.shadowMap.autoUpdate — that one is WebGL-path only, and setting it here
// silently does nothing.
sun.shadow.autoUpdate = false;

// ── Parameters & controls ─────────────────────────────────────────────────────
const params = {
  // New demo defaults (dialed-in look — film graded, on by default).
  azimuth: 119, elevation: 62.5, turbidity: 10, rayleigh: 0.6,
  sunIntensity: 20, exposure: 1,
  giEnabled: true, giIntensity: 20, giDivisions: 16, giCascades: 1, giContinuous: true,
  // quality knobs (defaults mirror gi_probes.js). smoothness is pinned to 1 (no slider).
  giRays: 64, giHysteresis: 0.6, giHysteresisNormalize: true, giJitterMode: 'gated', giNormalBias: 1.75,
  giRadianceClamp: 8, giDepthSharpness: 7, giLeak: 0.85, giSolid: 0, giSky: 2, giNormalDetail: 1,
  giReflectionQuality: REFLECTION_QUALITY, giReflectionIntensity: 1, giRoughnessLimit: 1,
  giChangeThreshold: 2.5, giSnapAmount: 0.30, giFireflyClamp: 6.0,   // adaptive temporal blend
  // Centered Sponza corridor hero view. Cluster mode pulls back to a wide
  // down-the-atrium view so the whole light grid is on screen at once.
  camX: 1.1982, camY: 4.5833, camZ: -3.463,
  targetX: -3.2952, targetY: 4.4996, targetZ: -3.2815,
  // Centre sphere + its transport animation.
  ballMode: 'metal', ballRadius: 0.55, ballRoughness: 0.06,
  ballEmissiveIntensity: 10,
  ballOrbit: 2.6, ballSpeed: 0.22, ballBob: 0.55,
  // Cluster mode: the point-light grid.
  lightCount: 50, lightIntensity: 8, lightRange: 7, markers: true,
  // PowerShot film (pinned look — one Film checkbox). Kodak 500T + these overrides.
  filmEnabled: true, filmStock: 'kodak_500t', filmAmount: 1.0, filmExposure: 1.55, filmGamma: 0.6,
  filmGrain: 0, filmGrainSize: 2.35, filmGrainSat: 0.8,
  filmHalation: 0, filmHalThreshold: 0.45, filmHalSoftness: 0.46, filmHalRadius: 1.8, filmHalColor: [1.0, 0.35, 0.08],
  filmWeave: 0, filmFlicker: 0, filmPrintExposure: -0.16, filmPrintWarmth: -0.17, filmNegative: false,
};
// Hosted Sponza always starts from these canonical values. Do not restore or persist
// GUI tweaks here; a public demo should recover to the intended look on every reload.

if (CLUSTER) {
  // Wide down-the-atrium hero view — shows the whole 10×5 light grid at once.
  params.camX = 9.5; params.camY = 6.8; params.camZ = -0.2;
  params.targetX = -6; params.targetY = 3.2; params.targetZ = 0.1;
  params.exposure = 1;
  params.filmEnabled = false;   // the grid's saturated point lights already carry the look
}
// Apply the one Sponza hero view.
if (MODEL.hero) {
  [params.camX, params.camY, params.camZ] = MODEL.hero.cam;
  [params.targetX, params.targetY, params.targetZ] = MODEL.hero.target;
}

function applyCamera() {
  camera.position.set(params.camX, params.camY, params.camZ);
  controls.target.set(params.targetX, params.targetY, params.targetZ);
}
applyCamera();
window.camera = camera;
window.controls = controls;
window.dumpCamera = () => ({
  camX: +camera.position.x.toFixed(4),
  camY: +camera.position.y.toFixed(4),
  camZ: +camera.position.z.toFixed(4),
  targetX: +controls.target.x.toFixed(4),
  targetY: +controls.target.y.toFixed(4),
  targetZ: +controls.target.z.toFixed(4),
});

const sunVec = new THREE.Vector3();
let gi = null;
const _giSkyZenith = new THREE.Color();
const _giSkyHorizon = new THREE.Color();
const _giSkyGround = new THREE.Color();

function updateGiSky() {
  if (!gi?.setSky) return;
  if (CLUSTER) return;   // no sky in cluster mode — the grid is the only source
  // Compute-safe sky injection: approximate the sun-free SkyMesh dome as low-frequency
  // SH-9 on the CPU, then the probe kernel reads only 9 vec3 uniforms. No texture
  // sampling, no derivatives, no probe memory. The directional sun remains direct-only.
  const elev = THREE.MathUtils.clamp(params.elevation, 0, 88);
  const sunUp = THREE.MathUtils.clamp(Math.sin(THREE.MathUtils.degToRad(elev)), 0, 1);
  const daylight = Math.sqrt(sunUp);
  const ray = THREE.MathUtils.clamp(params.rayleigh / 8, 0, 1);
  const turb = THREE.MathUtils.clamp(params.turbidity / 20, 0, 1);
  const haze = THREE.MathUtils.clamp((1 - daylight) * 0.65 + turb * 0.35, 0, 1);
  _giSkyZenith.setRGB(0.10 + 0.12 * ray, 0.20 + 0.20 * ray, 0.42 + 0.34 * ray).multiplyScalar(0.18 + 0.62 * daylight);
  _giSkyHorizon.setRGB(0.34 + 0.34 * haze, 0.39 + 0.18 * daylight, 0.48 + 0.24 * daylight).multiplyScalar(0.16 + 0.50 * daylight);
  _giSkyGround.setRGB(0.10, 0.085, 0.065).multiplyScalar(0.06 + 0.16 * daylight);
  gi.setSky({ zenith: _giSkyZenith, horizon: _giSkyHorizon, ground: _giSkyGround });
}

function updateSun() {
  if (CLUSTER) return;
  const phi = THREE.MathUtils.degToRad(90 - params.elevation);  // 0 = zenith
  const theta = THREE.MathUtils.degToRad(params.azimuth);
  sunVec.setFromSphericalCoords(1, phi, theta);
  sky.sunPosition.value.copy(sunVec);
  sky.turbidity.value = params.turbidity;
  sky.rayleigh.value = params.rayleigh;
  // place the directional light far along the sun vector, aimed at the scene
  sun.position.copy(sunVec).multiplyScalar(60);
  sun.target.position.set(0, 0, 0);
  sun.intensity = params.sunIntensity;
  // warm the sun as it nears the horizon
  const warm = THREE.MathUtils.clamp(params.elevation / 18, 0, 1);
  sun.color.setRGB(1.0, 0.6 + 0.4 * warm, 0.35 + 0.65 * warm);
  refreshSunConsumers();
  updateGiSky();
  markGiInteraction();
}

let sunGiDirty = false;
function markInteraction() { gi?.markInteraction?.(); }
function markGiInteraction() { markInteraction(); }
function markGuiInteraction() { markInteraction(); }
function flushSunGiRefresh() {
  if (!sunGiDirty || !gi?.forceLightingRefresh) return;
  sunGiDirty = false;
  gi.forceLightingRefresh();
}
function refreshSunConsumers() {
  sun.updateMatrixWorld(true);
  sun.target.updateMatrixWorld(true);
  sun.shadow.needsUpdate = true;
  // Pointer input may arrive several times between frames. Repack the light
  // arena once in the render loop instead of traversing the scene per event.
  sunGiDirty = true;
}
controls.addEventListener('change', markInteraction);
let resizePending = false;
function onResize() {
  resizePending = true;
  markInteraction();
}
function flushResize() {
  if (!resizePending) return;
  resizePending = false;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  resizeFilmTarget();
}
window.addEventListener('resize', onResize);

const gui = new GUI({ title: 'SPEEDBALL GI · Sky' });
function installGuiIdleGate(gui) {
  const el = gui?.domElement;
  if (!el) return () => {};
  const removers = [];
  const listen = (target, type, handler, options = true) => {
    target.addEventListener(type, handler, options);
    removers.push(() => target.removeEventListener(type, handler, options));
  };
  let active = false;
  const begin = () => { active = true; markGuiInteraction(); };
  const move = () => { if (active) markGuiInteraction(); };
  const touch = () => { markGuiInteraction(); };
  const end = () => { if (active) { active = false; markGuiInteraction(); } };
  listen(el, 'pointerdown', begin);
  listen(el, 'pointermove', move);
  for (const type of ['wheel', 'input', 'change', 'keydown']) listen(el, type, touch);
  for (const type of ['pointerup', 'pointercancel', 'blur']) listen(window, type, end);
  return () => removers.splice(0).forEach((remove) => remove());
}
const disposeGuiIdleGate = installGuiIdleGate(gui);
// Advanced lives with the other bottom-deck controls and parks the panel off-screen.
const guiToggleEl = document.getElementById('gui-toggle');
gui.domElement.classList.add('gui-hidden');
guiToggleEl.addEventListener('click', () => {
  const hidden = gui.domElement.classList.toggle('gui-hidden');
  guiToggleEl.setAttribute('aria-pressed', String(!hidden));
  if (!hidden) flushGuiDisplayRefresh();
});
const compactControls = window.matchMedia('(max-width: 700px), (max-height: 560px)');
const fSky = gui.addFolder('Sky / Sun');
const updateSunFromGui = () => { updateSun(); syncCoreControls(); };
fSky.add(params, 'azimuth', 0, 360, 1).name('azimuth°').onChange(updateSunFromGui);
fSky.add(params, 'elevation', -3, 88, 0.5).name('elevation°').onChange(updateSunFromGui);
// turbidity pinned to 10, rayleigh pinned to 0.6 (no sliders)
fSky.add(params, 'sunIntensity').min(0).step(0.05).name('sun intensity').onChange(updateSunFromGui);   // uncapped
// (the SPEEDBALL GI panel is added after gi is installed below — see addGiPanel)

updateSun();

// The post-rebuild material-recompile pass (the "GI silently missing" footgun) is now
// handled inside installSpeedballGI — no per-app boilerplate needed.

function prepareSponzaMaterialForGi(material) {
  if (!material || material.userData?.powerlightGiPrepared) return;
  material.userData = material.userData || {};
  material.userData.powerlightGiPrepared = true;

  // This Sponza glTF imports with scalar metalness = 1 on stone/fabric surfaces.
  // SPEEDBALL GI intentionally kills diffuse bounce for metals, so normalize the demo
  // asset to dielectric before the GI trace scene is packed.
  if (Number.isFinite(material.metalness) && material.metalness > 0.5) {
    material.metalness = 0;
    material.needsUpdate = true;
  }
  if (Number.isFinite(material.roughness) && material.roughness < 0.85) {
    material.roughness = 0.85;
    material.needsUpdate = true;
  }
}

// The Khronos Sponza glTF is one static mesh split into 103 primitives even
// though it uses only 25 materials. Preserve every vertex attribute and material,
// but bake each primitive's root-local transform and merge equal-material runs so
// the main view, the shadow map, and GI see 25 meshes instead of 103 draw objects.
function batchStaticMeshesByMaterial(root) {
  root.updateMatrixWorld(true);
  const rootWorldInverse = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const byMaterial = new Map();

  root.traverse((object) => {
    if (!object.isMesh || object.isSkinnedMesh || Array.isArray(object.material)) return;
    if (object.morphTargetInfluences?.length || !object.geometry?.index) return;
    const meshes = byMaterial.get(object.material) || [];
    meshes.push(object);
    byMaterial.set(object.material, meshes);
  });

  let inputMeshes = 0;
  let outputMeshes = 0;
  for (const [material, meshes] of byMaterial) {
    inputMeshes += meshes.length;
    if (meshes.length === 1) {
      outputMeshes += 1;
      continue;
    }

    const transformed = meshes.map((mesh) => {
      const geometry = mesh.geometry.clone();
      const toRoot = new THREE.Matrix4().multiplyMatrices(rootWorldInverse, mesh.matrixWorld);
      geometry.applyMatrix4(toRoot);
      return geometry;
    });
    const merged = mergeGeometries(transformed, false);
    for (const geometry of transformed) geometry.dispose();
    if (!merged) {
      outputMeshes += meshes.length;
      continue;
    }

    merged.computeBoundingBox();
    merged.computeBoundingSphere();
    const batch = new THREE.Mesh(merged, material);
    batch.name = `Sponza batch · ${material.name || material.uuid}`;
    batch.castShadow = true;
    batch.receiveShadow = true;
    root.add(batch);

    for (const mesh of meshes) {
      mesh.removeFromParent();
      mesh.geometry.dispose();
    }
    outputMeshes += 1;
  }

  root.updateMatrixWorld(true);
  return { inputMeshes, outputMeshes };
}

// ── SPEEDBALL GI — install at SETUP, before the first render ────────────────────
// The lights factory MUST be in place before any lit material compiles. Installing
// it after the render loop has started leaves a cached non-GI lights node, and GI
// never folds in (even a later recompile can't swap it). The probe field auto-fits
// and builds once Sponza is in the scene (idle-gated); markTopologyDirty() nudges it.
gi = installSpeedballGI({
  renderer, scene, camera,
  enabled: params.giEnabled,
  intensity: params.giIntensity,
  divisions: params.giDivisions,
  hysteresis: params.giHysteresis,
  jitterMode: params.giJitterMode,
  // Balanced local reflections: 8x8 glossy texels, interleaved half-rate resolve,
  // and a continuous 8-probe receiver. Use `ultra` for a 16x16/full-rate cache.
  reflectionQuality: params.giReflectionQuality,
  reflectionIntensity: params.giReflectionIntensity,
  roughnessLimit: 1,
  // This demo has a procedural SkyMesh but no PMREM environment. Let probe miss
  // rays provide its explicit distant-specular layer; SSR can still composite later.
  // In cluster mode there is no sky at all, so the fallback would only add a lie.
  reflectionSkyFallback: !CLUSTER,
  // The demo emits exact transform/material/light/topology notifications, so it
  // does not need the compatibility scene-signature traversals.
  autoDetectChanges: false,
  // clusteredLighting swaps the batched DynamicLightsNode for the Forward+
  // GiClusteredLightsNode (no 16-point batch cap) and switches the GI lane to its
  // fixed importance-budgeted arena. Install-time only — see SCENE_MODE.
  clusteredLighting: CLUSTER,
});
if (!gi.isSupported()) setStatus('SPEEDBALL GI needs WebGPU storage features.', true);
// Push the canonical settings so the GUI and the GI uniforms agree on first paint.
// Smoothness/denoise stay pinned (no slider).
gi.setSmoothness(1);                       // pinned (no slider)
gi.setFilterStrength(1);   // denoise pinned on (no slider): redundant at these defaults, but harmless
applyGiSettings(gi, params);
updateGiSky();
refreshSunConsumers();
// The GI panel is shared helper code, but Sponza itself is intentionally not persisted:
// visitors can experiment, then reload back to the release tuning.
addGiPanel(gui, gi, params, {
  onInteract: () => { markGiInteraction(); syncCoreControls(); },
  onReflectionQuality: (quality) => {
    if (quality !== REFLECTION_QUALITY) reloadWithStructuralSetting('reflections', quality, 'high');
  },
});

// ── Centre-bottom core interface ──────────────────────────────────────────────
// The drawer keeps the full expert surface; these are the handful of controls
// that define the demo and stay visible beside the material modes.
const sunBallEl = document.getElementById('sun-ball');
const sunDotEl = document.getElementById('sun-dot');
const sunReadoutEl = document.getElementById('sun-readout');
const intensitySliderEl = document.getElementById('intensity-slider');
const intensityValueEl = document.getElementById('intensity-value');
const divisionsSliderEl = document.getElementById('divisions-slider');
const divisionsValueEl = document.getElementById('divisions-value');
const raysSliderEl = document.getElementById('rays-slider');
const raysValueEl = document.getElementById('rays-value');
const hysteresisMeterEl = document.getElementById('hysteresis-meter');
const hysteresisSliderEl = document.getElementById('hysteresis-slider');
const hysteresisValueEl = document.getElementById('hysteresis-value');
const hysteresisStateEl = document.getElementById('hysteresis-state');
const jitterGatedEl = document.getElementById('jitter-gated');
const jitterMcEl = document.getElementById('jitter-mc');

let guiDisplayRefreshPending = false;
function requestGuiDisplayRefresh() {
  guiDisplayRefreshPending = true;
}
function flushGuiDisplayRefresh() {
  if (!guiDisplayRefreshPending || gui.domElement.classList.contains('gui-hidden')) return;
  guiDisplayRefreshPending = false;
  gui.controllersRecursive?.().forEach((controller) => controller.updateDisplay());
}

function syncCoreControls() {
  const az = THREE.MathUtils.degToRad(params.azimuth);
  const el = THREE.MathUtils.degToRad(params.elevation);
  const orbit = 19;
  const x = Math.sin(az) * Math.cos(el) * orbit;
  const y = -Math.sin(el) * orbit;
  sunDotEl.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  sunReadoutEl.textContent = `${Math.round(params.azimuth)}° / ${params.elevation.toFixed(1)}°`;
  intensitySliderEl.value = String(params.sunIntensity);
  intensityValueEl.textContent = Number(params.sunIntensity).toFixed(1).replace(/\.0$/, '');
  divisionsSliderEl.value = String(params.giDivisions);
  divisionsValueEl.textContent = String(params.giDivisions);
  raysSliderEl.value = String(params.giRays);
  raysValueEl.textContent = String(params.giRays);
  hysteresisSliderEl.value = String(params.giHysteresis);
  hysteresisValueEl.textContent = Number(params.giHysteresis).toFixed(2);
  const threshold = params.giJitterMode === 'montecarlo' ? 0.9 : 0.6;
  const danger = params.giHysteresis < threshold;
  const dangerStop = ((threshold - 0.5) / (0.99 - 0.5)) * 100;
  hysteresisMeterEl.style.setProperty('--danger-stop', `${dangerStop}%`);
  hysteresisMeterEl.classList.toggle('danger', danger);
  hysteresisStateEl.textContent = danger ? 'UNSTABLE' : 'STABLE';
  jitterGatedEl.setAttribute('aria-pressed', String(params.giJitterMode === 'gated'));
  jitterMcEl.setAttribute('aria-pressed', String(params.giJitterMode === 'montecarlo'));
}

let sunDrag = null;
sunBallEl.addEventListener('pointerdown', (event) => {
  sunDrag = { x: event.clientX, y: event.clientY, azimuth: params.azimuth, elevation: params.elevation };
  sunBallEl.setPointerCapture(event.pointerId);
});
sunBallEl.addEventListener('pointermove', (event) => {
  if (!sunDrag || !sunBallEl.hasPointerCapture(event.pointerId)) return;
  params.azimuth = (sunDrag.azimuth + (event.clientX - sunDrag.x) * 1.4 + 360) % 360;
  params.elevation = THREE.MathUtils.clamp(sunDrag.elevation - (event.clientY - sunDrag.y) * 0.9, -3, 88);
  updateSun();
  syncCoreControls();
  requestGuiDisplayRefresh();
});
sunBallEl.addEventListener('pointerup', () => { sunDrag = null; });
sunBallEl.addEventListener('pointercancel', () => { sunDrag = null; });

intensitySliderEl.addEventListener('input', () => {
  params.sunIntensity = Number(intensitySliderEl.value);
  updateSun(); syncCoreControls(); requestGuiDisplayRefresh();
});
divisionsSliderEl.addEventListener('input', () => {
  params.giDivisions = Number(divisionsSliderEl.value);
  syncCoreControls(); requestGuiDisplayRefresh();
});
divisionsSliderEl.addEventListener('change', () => {
  gi.setDivisions(params.giDivisions); markGiInteraction();
});
raysSliderEl.addEventListener('input', () => {
  params.giRays = Number(raysSliderEl.value);
  syncCoreControls(); requestGuiDisplayRefresh();
});
raysSliderEl.addEventListener('change', () => {
  gi.setRays(params.giRays); markGiInteraction();
});
hysteresisSliderEl.addEventListener('input', () => {
  params.giHysteresis = Number(hysteresisSliderEl.value);
  gi.setHysteresis(params.giHysteresis); markGiInteraction();
  syncCoreControls(); requestGuiDisplayRefresh();
});
function setJitterMode(mode) {
  gi.setJitterMode?.(mode);
  params.giJitterMode = gi.getJitterMode?.() ?? mode;
  params.giHysteresis = gi.getHysteresis?.() ?? params.giHysteresis;
  markGiInteraction();
  syncCoreControls(); requestGuiDisplayRefresh();
}
jitterGatedEl.addEventListener('click', () => setJitterMode('gated'));
jitterMcEl.addEventListener('click', () => setJitterMode('montecarlo'));
setJitterMode(params.giJitterMode);
syncCoreControls();

window.gi = gi; // console handle for poking
window.gui = gui;
window.scene = scene; window.renderer = renderer; window.markGiMaterialsDirty = gi.markMaterialsDirty; // diagnostics

// ── PowerShot film emulation (motion-picture negative→print chain) ──────────────
// The film is the IMAGER: it's fed SCENE-LINEAR radiance from one half-float scene
// target (with NO display transform) and owns the
// ENTIRE transfer curve — H&D negative → print → display sRGB. Tone-mapping first would
// stack two response curves (a camera doesn't photograph a tone-mapped JPEG of the world).
// LinearSRGBColorSpace presents the film's own display-encoded sRGB verbatim.
// This mirrors how max.js drives the same physically-correct film.
const film = new FilmPipeline(renderer);
film.setInputEncoding('linear');
applyFilmPreset(film.ctx, FILM_PRESETS[params.filmStock]);
const P = film.ctx.P;
// Tuned baseline overrides. Apply after the stock preset so the look is deterministic.
film.ctx.power.value = params.filmAmount;        // 1.0 = full film, no blend with source
P.exposure.value = params.filmExposure;          // photographic stops on the LINEAR input; −0.5 ≈ the scene's display exposure (0.7 = −0.5 stops) so mid-gray lands on the film's 0.18 reference
P.inputGamma.value = params.filmGamma;           // pre-H&D exposure-domain shaping (film default 0.65), NOT an sRGB decode
P.grainStrength.value = params.filmGrain;
P.grainSize.value = params.filmGrainSize;
P.grainSaturation.value = params.filmGrainSat;
P.halStrength.value = params.filmHalation;
P.halThreshold.value = params.filmHalThreshold;
P.halSoftness.value = params.filmHalSoftness;
P.halRadius.value = params.filmHalRadius;
P.halColor.value.fromArray(params.filmHalColor);
// A zero-strength halo still costs three quarter-resolution passes unless the
// stage itself is disabled. Keep the pinned no-halation look genuinely cheap.
film.setEnabled('halation', params.filmHalation > 0);
P.weave.value = params.filmWeave;
P.flicker.value = params.filmFlicker;
P.printExposure.value = params.filmPrintExposure * 0.301;   // stops → log10 density (matches max.js)
P.printWarmth.value = params.filmPrintWarmth;
P.negativeView.value = params.filmNegative ? 1 : 0;
const filmSceneTarget = new THREE.RenderTarget(1, 1, {
  type: THREE.HalfFloatType,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  depthBuffer: true,
  colorSpace: THREE.NoColorSpace,
});
const filmTargetSize = new THREE.Vector2();
let filmFrame = 0;
function resizeFilmTarget() {
  renderer.getDrawingBufferSize(filmTargetSize);
  const width = Math.max(1, Math.round(filmTargetSize.x));
  const height = Math.max(1, Math.round(filmTargetSize.y));
  filmSceneTarget.setSize(width, height);
  film.setSize(width, height);
}
resizeFilmTarget();
window.film = film;

let displayExposure = params.exposure;
params.exposure = params.filmEnabled ? params.filmExposure : displayExposure;
if (!params.filmEnabled) renderer.toneMappingExposure = displayExposure;
const exposureCtrl = gui.add(params, 'exposure').min(0).step(0.01).name('exposure').onChange((v) => {
  if (params.filmEnabled) {
    params.filmExposure = v;
    P.exposure.value = v;
  } else {
    displayExposure = v;
    renderer.toneMappingExposure = v;
  }
});
gui.add(params, 'filmEnabled').name('Film').onChange((on) => {
  params.exposure = on ? params.filmExposure : displayExposure;
  if (on) P.exposure.value = params.filmExposure;
  else renderer.toneMappingExposure = displayExposure;
  exposureCtrl.updateDisplay();
});

// ── Centre sphere ─────────────────────────────────────────────────────────────
let ball = null;
let sponzaBounds = null;
let sceneReady = false;
const ballHome = new THREE.Vector3();
let playing = false;
let animClock = 0;          // seconds of animation played, paused-time excluded
let lastAnimMs = 0;

const BALL_MODES = ['emissive', 'metal'];

function syncBallModeButtons() {
  for (const mode of BALL_MODES) {
    document.getElementById(`ball-${mode}`).setAttribute('aria-pressed', String(params.ballMode === mode));
  }
}

function applyBallMaterialMode() {
  if (!ball) return;
  const m = ball.material;
  m.emissive.set(0x000000);
  m.emissiveIntensity = 0;

  if (params.ballMode === 'emissive') {
    m.color.set(0x321408);
    m.metalness = 0;
    m.roughness = 0.34;
    m.emissive.set(0xff8a2b);
    m.emissiveIntensity = params.ballEmissiveIntensity;
  } else {
    m.color.set(0xc6d0d8);
    m.metalness = 1;
    m.roughness = params.ballRoughness;
  }
}

function setBallMode(next, { initial = false } = {}) {
  if (!BALL_MODES.includes(next)) return;
  params.ballMode = next;
  syncBallModeButtons();
  applyBallMaterialMode();

  if (ball && !initial) {
    // The mesh is permanently opted into emitter discovery. Emissive black means
    // zero records in metal mode; turning emission on adds the same sphere as a
    // type-3 NEE source without rebuilding its geometry.
    gi?.markMaterialValuesDirty?.(ball);
    gi?.forceLightingRefresh?.();
  }
  if (!initial) markGiInteraction();
}

for (const mode of BALL_MODES) {
  document.getElementById(`ball-${mode}`).addEventListener('click', () => setBallMode(mode));
}
syncBallModeButtons();

const fBall = gui.addFolder('Centre sphere');
fBall.add(params, 'ballRoughness', 0, 0.6, 0.005).name('roughness').onChange((v) => {
  if (!ball) return;
  if (params.ballMode === 'emissive') return;
  ball.material.roughness = v;
  gi?.markMaterialValuesDirty?.(ball);
  markGiInteraction();
});
fBall.add(params, 'ballOrbit', 0, 6, 0.05).name('orbit radius').onChange(markInteraction);
fBall.add(params, 'ballBob', 0, 2, 0.01).name('bob height').onChange(markInteraction);
fBall.add(params, 'ballSpeed', 0.02, 1, 0.01).name('speed').onChange(markInteraction);

// ── Cluster mode: light grid controls (this scene mode only) ──────────────────
if (CLUSTER) {
  const fLights = gui.addFolder('Light grid');
  fLights.add(params, 'lightCount', 10, 500, 10).name('light count (stress)').onFinishChange((v) => {
    rebuildLights(v);
    gi.forceLightingRefresh();     // count change = arena refill in clustered mode, never a rebuild
  });
  fLights.add(params, 'lightIntensity', 0, 40, 0.1).name('intensity').onChange((v) => {
    for (const l of pointLights) l.intensity = v;
    gi.forceLightingRefresh();
  });
  fLights.add(params, 'lightRange', 0, 20, 0.1).name('range').onChange((v) => {
    for (const l of pointLights) l.distance = v;
    gi.forceLightingRefresh();     // the light lane catches this within ~6 ticks; kick it for instant response
  });
  fLights.add(params, 'markers').name('markers').onChange((v) => { if (markerMesh) markerMesh.visible = v; });
}

if (compactControls.matches) gui.close();

// ── Centre sphere transport ───────────────────────────────────────────────────
// The sphere is the demo's moving part. Standing still, GI convergence is easy to
// fake with a long temporal tail; put a mirror ball on a circuit through the
// atrium and the reflection lane has to keep up every frame. The transport is
// therefore the honest stress test, not decoration.
function updateBallAnimation(nowMs) {
  if (!ball) return;
  if (!playing) { lastAnimMs = nowMs; return; }
  const dt = lastAnimMs ? Math.min(0.1, (nowMs - lastAnimMs) / 1000) : 0;
  lastAnimMs = nowMs;
  animClock += dt;
  const t = animClock * params.ballSpeed * Math.PI * 2;
  // A slow circuit down the atrium's long axis with a vertical bob — the ball
  // passes the red drapes on one side and the blue on the other, so the colour
  // its reflection picks up changes continuously.
  ball.position.set(
    ballHome.x + Math.sin(t) * params.ballOrbit,
    ballHome.y + Math.sin(t * 2) * params.ballBob,
    ballHome.z + Math.cos(t) * params.ballOrbit * 0.35,
  );
  ball.rotation.y = t * 0.5;
  ball.updateMatrixWorld(true);
  gi?.markTransformsDirty?.(ball);
}

const playEl = document.getElementById('play');
function setPlaying(on) {
  playing = on === true;
  lastAnimMs = 0;
  playEl.setAttribute('aria-pressed', String(playing));
  playEl.querySelector('.label').textContent = playing ? 'PAUSE' : 'ANIMATE';
  markInteraction();
}
playEl.addEventListener('click', () => setPlaying(!playing));

// ── Cluster mode: the point-light grid ────────────────────────────────────────
const pointLights = [];
let markerMesh = null;

function rebuildLights(count) {
  count = Math.max(1, Math.round(count));
  for (const l of pointLights) scene.remove(l);
  pointLights.length = 0;
  if (markerMesh) {
    scene.remove(markerMesh);
    markerMesh.geometry.dispose();
    markerMesh.material.dispose();
    markerMesh = null;
  }
  if (!sponzaBounds) return;
  const bounds = sponzaBounds;
  const size = bounds.getSize(new THREE.Vector3());
  const x0 = bounds.min.x + size.x * 0.08, x1 = bounds.max.x - size.x * 0.08;
  const z0 = bounds.min.z + size.z * 0.14, z1 = bounds.max.z - size.z * 0.14;
  // Vertical band: lantern height up through the gallery level, under the vaults.
  const y0 = bounds.min.y + size.y * 0.16, y1 = bounds.min.y + size.y * 0.62;
  // 3D grid: Y layers scale with count (50 → 2 layers, 500 → 4), each layer a
  // ~2:1 x:z grid matching the atrium's long axis.
  const gy = count < 40 ? 1 : count < 150 ? 2 : count < 350 ? 3 : 4;
  const perLayer = Math.ceil(count / gy);
  const gz = Math.max(1, Math.round(Math.sqrt(perLayer / 2)));
  const gx = Math.max(1, Math.ceil(perLayer / gz));
  const color = new THREE.Color();
  for (let idx = 0; idx < count; idx++) {
    const iy = Math.floor(idx / perLayer);
    const inLayer = idx % perLayer;
    const ix = inLayer % gx, iz = Math.floor(inLayer / gx);
    color.setHSL(idx / count, 0.95, 0.55);
    const light = new THREE.PointLight(color.clone(), params.lightIntensity, params.lightRange, 2);
    light.castShadow = false;                      // clustering handles non-shadowed points
    light.position.set(
      THREE.MathUtils.lerp(x0, x1, gx > 1 ? ix / (gx - 1) : 0.5),
      THREE.MathUtils.lerp(y0, y1, gy > 1 ? iy / (gy - 1) : 0.5),
      THREE.MathUtils.lerp(z0, z1, gz > 1 ? iz / (gz - 1) : 0.5),
    );
    scene.add(light);
    pointLights.push(light);
  }
  // Emissive-looking markers so the grid is inspectable (kept OUT of the GI BVH —
  // excluded meshes don't churn the structure lane on rebuild).
  const geo = new THREE.SphereGeometry(0.05, 10, 8);
  const mat = new THREE.MeshBasicMaterial({ toneMapped: false });
  markerMesh = new THREE.InstancedMesh(geo, mat, pointLights.length);
  const m = new THREE.Matrix4();
  for (let i = 0; i < pointLights.length; i++) {
    m.makeTranslation(pointLights[i].position.x, pointLights[i].position.y, pointLights[i].position.z);
    markerMesh.setMatrixAt(i, m);
    markerMesh.setColorAt(i, pointLights[i].color);
  }
  markerMesh.instanceMatrix.needsUpdate = true;
  markerMesh.instanceColor.needsUpdate = true;
  markerMesh.visible = params.markers;
  excludeFromGI(markerMesh);
  scene.add(markerMesh);
}

// ── Load Sponza ────────────────────────────────────────────────────────────────
setStatus(`loading ${MODEL.meta.split(' ')[0]}…`);
new GLTFLoader().load(MODEL.url, (gltf) => {
  const root = gltf.scene;
  if (demoDisposed) {
    disposeObjectResources(root);
    return;
  }
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    if (Array.isArray(o.material)) o.material.forEach(prepareSponzaMaterialForGi);
    else prepareSponzaMaterialForGi(o.material);
  });
  const batches = batchStaticMeshesByMaterial(root);
  console.info(`Sponza static batches: ${batches.inputMeshes} meshes -> ${batches.outputMeshes} material batches`);
  scene.add(root);

  // frame the camera to the model and size the shadow camera to its bounds
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  if (MODEL.hero) {
    applyCamera();
  } else {
    // No dialed-in hero view for this model yet. Frame from OUTSIDE the bounding
    // box looking in, at a raised 3/4 angle: an interior guess needs to know where
    // the open space is, and getting that wrong buries the camera inside a wall.
    // Outside-looking-in is wrong-but-safe for any model. Dial a real view by
    // hand, then paste window.dumpCamera() into this model's `hero`.
    const centre = box.getCenter(new THREE.Vector3());
    const dist = radius * 1.15;
    camera.position.set(
      centre.x + dist * 0.75,
      box.min.y + size.y * 0.62,
      centre.z + dist * 0.75,
    );
    controls.target.set(centre.x, box.min.y + size.y * 0.25, centre.z);
    controls.update();
  }

  // ── Centre sphere ────────────────────────────────────────────────────────
  // One physical sphere carries the emission and metal transport demonstrations.
  // It remains a real traced scene object; only its material/emitter values change.
  sponzaBounds = box.clone();
  const centre = box.getCenter(new THREE.Vector3());
  ballHome.set(centre.x, box.min.y + size.y * (MODEL.ballHeight ?? 0.30), centre.z);
  const centreBall = new THREE.Mesh(
    new THREE.SphereGeometry(params.ballRadius, 64, 40),
    new THREE.MeshStandardMaterial({ color: 0xc6d0d8, metalness: 1, roughness: params.ballRoughness }),
  );
  centreBall.name = 'Centre Sphere';
  centreBall.position.copy(ballHome);
  // Keep the 103-caster Sponza shadow map static. Re-rendering the entire 2048²
  // map for this diagnostic mover obscures the GI transform cost being demonstrated.
  centreBall.castShadow = false;
  centreBall.receiveShadow = true;
  centreBall.userData.giEmitter = true;
  scene.add(centreBall);
  ball = centreBall;
  setBallMode(params.ballMode, { initial: true });

  camera.near = radius * 0.01; camera.far = radius * 30; camera.updateProjectionMatrix();
  const sc = sun.shadow.camera;
  sc.left = -radius; sc.right = radius; sc.top = radius; sc.bottom = -radius;
  sc.near = 0.1; sc.far = radius * 8; sc.updateProjectionMatrix();
  sky.scale.setScalar(camera.far * 0.5);
  sun.shadow.needsUpdate = true;   // first and only render until something moves

  if (CLUSTER) rebuildLights(params.lightCount);

  // model is in the scene now → build the probe field over it.
  gi.markTopologyDirty();
  sceneReady = true;
  hideStatus();
  markInteraction();
}, (xhr) => {
  if (demoDisposed) return;
  if (xhr.total) setStatus(`loading ${MODEL.meta.split(' ')[0]}… ` + Math.min(100, Math.round(xhr.loaded / xhr.total * 100)) + '%');
}, (err) => {
  if (demoDisposed) return;
  setStatus(`Failed to load ${MODEL.url}\n` + (err?.message || err), true);
});

// ── Render loop ───────────────────────────────────────────────────────────────
function disposeObjectResources(root) {
  if (!root?.traverse) return;
  const geometries = new Set();
  const materials = new Set();
  const textures = new Set();
  root.traverse((object) => {
    if (object.geometry) geometries.add(object.geometry);
    const list = Array.isArray(object.material) ? object.material : (object.material ? [object.material] : []);
    for (const material of list) {
      if (!material || materials.has(material)) continue;
      materials.add(material);
      for (const value of Object.values(material)) if (value?.isTexture) textures.add(value);
    }
  });
  for (const geometry of geometries) geometry.dispose?.();
  for (const material of materials) material.dispose?.();
  for (const texture of textures) texture.dispose?.();
}

function disposeDemo({ waitForDevice = true } = {}) {
  if (disposePromise) return disposePromise;
  demoDisposed = true;
  sceneReady = false;
  renderer.setAnimationLoop(null);
  document.getElementById('transport').inert = true;

  disposePromise = (async () => {
    controls.removeEventListener('change', markInteraction);
    window.removeEventListener('resize', onResize);
    window.removeEventListener('error', onWindowError);
    window.removeEventListener('unhandledrejection', onUnhandledRejection);
    window.removeEventListener('pagehide', onPageHide);
    disposeGuiIdleGate();
    gui.destroy();

    gi?.dispose?.();
    filmSceneTarget.dispose();
    film.dispose();
    sun.shadow.dispose?.();
    disposeObjectResources(scene);
    controls.dispose();

    const deviceLost = renderer.backend?.device?.lost;
    renderer.dispose();
    window.gi = window.gui = window.scene = window.renderer = window.film = null;
    window.controls = window.camera = window.dumpCamera = window.markGiMaterialsDirty = null;

    // WebGPURenderer.dispose() is synchronous in r185, while D3D12 retires the
    // command queue asynchronously. Structural reloads wait before allocating
    // the replacement device; ordinary page teardown does not delay navigation.
    if (waitForDevice && deviceLost) {
      await Promise.race([
        deviceLost,
        new Promise((resolve) => setTimeout(resolve, 2000)),
      ]);
    }
    if (waitForDevice) await new Promise((resolve) => setTimeout(resolve, 50));
  })();
  return disposePromise;
}

function disposeForStructuralReload() {
  return disposeDemo({ waitForDevice: true });
}

function onPageHide(event) {
  if (!event.persisted) void disposeDemo({ waitForDevice: false });
}
window.addEventListener('pagehide', onPageHide);

renderer.setAnimationLoop((nowMs) => {
  flushResize();
  controls.update();
  flushGuiDisplayRefresh();
  if (!sceneReady || demoDisposed) return;
  updateBallAnimation(nowMs);

  if (sunGiDirty) flushSunGiRefresh();
  // Heavy BVH/kernel rebuilds remain rest-gated. This demo keeps the bounded solve
  // continuous for live light feedback, and `playing` identifies real scene motion
  // so transform packets and post-playback budget recovery follow the public API.
  gi?.update({ playing });
  if (params.filmEnabled) {
    renderer.toneMapping = THREE.NoToneMapping;       // imager: the film owns the whole transfer curve (scene-linear in)
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // film already emits display-encoded sRGB
    renderer.setRenderTarget(filmSceneTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    film.renderTexture(filmSceneTarget.texture, filmFrame++); // fused Kodak develop directly to the canvas
  } else {
    renderer.toneMapping = THREE.NeutralToneMapping;  // film off → switch back to the display tone-map (sRGB)
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.render(scene, camera);
  }
});
</script>
</body>
</html>
