<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SPEEDBALL GI — clustered lighting (50 lights, no sun)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/concrete_connect.css">
<style>
  /* Concrete Connect / E16 branding (see css/concrete_connect.css). */
  :root { --mono: 'JetBrains Mono', ui-monospace, "Cascadia Code", Menlo, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; color: #111;
    font: 12px/1.5 var(--mono); }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #hud { position: fixed; left: 14px; top: 12px; pointer-events: none; max-width: 46ch; z-index: 10;
    color: #f2f2f2; text-shadow: 0 1px 2px #000, 0 0 2px #000c; }
  #hud .title { font: 800 13px/1.5 Verdana, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
  #hud .sub { color: #d6d6d6; }

  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    padding: 14px 22px; color: #111; white-space: pre; text-align: center;
    background: linear-gradient(to bottom, #eeeeee, #b8b8b8); border: 1px solid #242424; border-radius: 6px;
    box-shadow: 6px 8px 20px rgba(0,0,0,0.45), inset 1px 1px 2px rgba(255,255,255,0.9);
    font: 700 11px/1.5 var(--mono); text-shadow: 1px 1px 0 #fff; }
  #status.err { border-color: #6b2330; color: #7a0e1c; background: linear-gradient(to bottom, #f0dede, #cc9a9a); text-shadow: none; }
  #status.hide { display: none; }

  .lil-gui { --width: 300px; --font-size: 11px;
    --background-color: #cccccc; --text-color: #141414;
    --title-background-color: #b8b8b8; --title-text-color: #050505;
    --widget-color: #909090; --hover-color: #9e9e9e; --focus-color: #ababab;
    --number-color: #0b3d6b; --string-color: #3a5f2a;
    --font-family: Verdana, system-ui, sans-serif; --font-family-mono: var(--mono);
    --widget-height: 20px; }
  .lil-gui.root { border: 1px solid #242424; border-radius: 8px 8px 3px 3px;
    background: linear-gradient(to bottom, #e4e4e4, #bcbcbc);
    box-shadow: 7px 9px 24px rgba(0,0,0,0.48), inset 1px 1px 2px rgba(255,255,255,0.96); }
  .lil-gui.root > .title { background: linear-gradient(to bottom, #d9d9d9 0%, #bdbdbd 44%, #8f8f8f 50%, #b8b8b8 100%);
    border-bottom: 1px solid #555; color: #050505; text-shadow: 1px 1px 0 #fff;
    font: 800 11px/1 Verdana, system-ui, sans-serif; letter-spacing: 0.10em; text-transform: uppercase; }
  .lil-gui .children { background: transparent; }
  .lil-gui .title { text-shadow: 1px 1px 0 rgba(255,255,255,0.45); }

  @media (max-width: 700px), (max-height: 560px) {
    #hud { left: 10px; top: max(8px, env(safe-area-inset-top)); max-width: calc(100vw - 20px); }
    #hud .title { font-size: 11px; letter-spacing: 0.08em; }
    #hud .sub { display: none; }
    #status { width: min(320px, calc(100vw - 32px)); box-sizing: border-box; white-space: pre-wrap; }
    .lil-gui { --width: calc(100vw - 16px); --font-size: 12px; --widget-height: 26px; }
    .lil-gui.root {
      position: fixed !important;
      left: 8px !important; right: 8px !important; top: auto !important;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      width: auto !important; max-height: min(34vh, 360px); overflow-y: auto;
      overscroll-behavior: contain; touch-action: pan-y;
    }
    .lil-gui.root.closed { max-height: 32px; overflow: hidden; }
    .lil-gui.root > .title { min-height: 28px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js"
  },
  "scopes": {
    "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js" }
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="title">SPEEDBALL GI · CLUSTERED</div>
  <span class="sub"><span id="lightCountLabel">50</span> point lights · no sky, no sun · Forward+ clustered raster + importance-budgeted GI · <a href="./index.html" style="color:#9ec8ff;pointer-events:auto;text-decoration:none">sky demo</a></span>
  <div id="mon" class="sub"></div>
</div>
<div id="status">initializing WebGPU…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';
import { installSpeedballGI, excludeFromGI } from './js/index.js';

const statusEl = document.getElementById('status');
const setStatus = (msg, err = false) => { statusEl.textContent = msg; statusEl.classList.toggle('err', err); statusEl.classList.remove('hide'); };
const hideStatus = () => statusEl.classList.add('hide');
window.addEventListener('error', (e) => setStatus('Error:\n' + (e.error?.stack || e.message), true));
window.addEventListener('unhandledrejection', (e) => setStatus('Error:\n' + (e.reason?.stack || e.reason), true));

// ── Renderer ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
await renderer.init();
if (renderer.backend?.isWebGPUBackend !== true) {
  setStatus('WebGPU not available.\nThis demo needs a WebGPU-capable browser\n(Chrome/Edge 121+, or Firefox Nightly).', true);
  throw new Error('WebGPU unavailable');
}

// ── Scene & camera — deliberately NO sky, NO sun, NO ambient ─────────────────
// Every photon in this scene comes from the 50-light grid: the clustered raster
// node draws their direct term, the probe field carries their bounce.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.05, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const params = {
  giEnabled: true, giIntensity: 20,
  lightCount: 50, lightIntensity: 8, lightRange: 7, markers: true,
  exposure: 1,
  // Wide down-the-atrium hero view — shows the whole 10×5 light grid at once.
  camX: 9.5, camY: 6.8, camZ: -0.2,
  targetX: -6, targetY: 3.2, targetZ: 0.1,
};
camera.position.set(params.camX, params.camY, params.camZ);
controls.target.set(params.targetX, params.targetY, params.targetZ);
window.camera = camera; window.controls = controls;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── SPEEDBALL GI — clustered lighting mode, installed at SETUP ────────────────
// clusteredLighting: true swaps the batched DynamicLightsNode for the Forward+
// GiClusteredLightsNode (every non-shadowed point light clusters — no 16-point
// batch cap) and switches the GI lane to its fixed importance-budgeted arena.
const gi = installSpeedballGI({
  renderer, scene, camera,
  enabled: params.giEnabled,
  intensity: params.giIntensity,
  divisions: 16,
  hysteresis: 0.95,
  clusteredLighting: true,
});
if (!gi.isSupported()) setStatus('SPEEDBALL GI needs WebGPU storage features.', true);
window.gi = gi; window.scene = scene; window.renderer = renderer;

// ── The light grid (rebuildable: 10..500 via the stress slider) ───────────────
// Rebuilding at a NEW count is the tier-2 stress test: in clustered mode the GI
// lane absorbs a light-count change as an arena refill + count-uniform write —
// never a BVH rebuild — and past 64 lights the importance selection picks which
// records the probes shade.
const pointLights = [];
let markerMesh = null;
let sponzaBounds = null;

function rebuildLights(count) {
  count = Math.max(1, Math.round(count));
  for (const l of pointLights) scene.remove(l);
  pointLights.length = 0;
  if (markerMesh) {
    scene.remove(markerMesh);
    markerMesh.geometry.dispose();
    markerMesh.material.dispose();
    markerMesh = null;
  }
  if (!sponzaBounds) return;
  const bounds = sponzaBounds;
  const size = bounds.getSize(new THREE.Vector3());
  const x0 = bounds.min.x + size.x * 0.08, x1 = bounds.max.x - size.x * 0.08;
  const z0 = bounds.min.z + size.z * 0.14, z1 = bounds.max.z - size.z * 0.14;
  // Vertical band: lantern height up through the gallery level, under the vaults.
  const y0 = bounds.min.y + size.y * 0.16, y1 = bounds.min.y + size.y * 0.62;
  // 3D grid: Y layers scale with count (50 → 2 layers, 500 → 4), each layer a
  // ~2:1 x:z grid matching the atrium's long axis.
  const gy = count < 40 ? 1 : count < 150 ? 2 : count < 350 ? 3 : 4;
  const perLayer = Math.ceil(count / gy);
  const gz = Math.max(1, Math.round(Math.sqrt(perLayer / 2)));
  const gx = Math.max(1, Math.ceil(perLayer / gz));
  const color = new THREE.Color();
  for (let idx = 0; idx < count; idx++) {
    const iy = Math.floor(idx / perLayer);
    const inLayer = idx % perLayer;
    const ix = inLayer % gx, iz = Math.floor(inLayer / gx);
    color.setHSL(idx / count, 0.95, 0.55);
    const light = new THREE.PointLight(color.clone(), params.lightIntensity, params.lightRange, 2);
    light.castShadow = false;                      // clustering handles non-shadowed points
    light.position.set(
      THREE.MathUtils.lerp(x0, x1, gx > 1 ? ix / (gx - 1) : 0.5),
      THREE.MathUtils.lerp(y0, y1, gy > 1 ? iy / (gy - 1) : 0.5),
      THREE.MathUtils.lerp(z0, z1, gz > 1 ? iz / (gz - 1) : 0.5),
    );
    scene.add(light);
    pointLights.push(light);
  }
  // Emissive-looking markers so the grid is inspectable (kept OUT of the GI BVH —
  // and since 2abc2cd, excluded meshes don't churn the structure lane on rebuild).
  const geo = new THREE.SphereGeometry(0.05, 10, 8);
  const mat = new THREE.MeshBasicMaterial({ toneMapped: false });
  markerMesh = new THREE.InstancedMesh(geo, mat, pointLights.length);
  const m = new THREE.Matrix4();
  for (let i = 0; i < pointLights.length; i++) {
    m.makeTranslation(pointLights[i].position.x, pointLights[i].position.y, pointLights[i].position.z);
    markerMesh.setMatrixAt(i, m);
    markerMesh.setColorAt(i, pointLights[i].color);
  }
  markerMesh.instanceMatrix.needsUpdate = true;
  markerMesh.instanceColor.needsUpdate = true;
  markerMesh.visible = params.markers;
  excludeFromGI(markerMesh);
  scene.add(markerMesh);
  document.getElementById('lightCountLabel').textContent = String(count);
}

// ── GUI ───────────────────────────────────────────────────────────────────────
const gui = new GUI({ title: 'SPEEDBALL GI · Clustered' });
gui.add(params, 'lightCount', 10, 500, 10).name('light count (stress)').onFinishChange((v) => {
  rebuildLights(v);
  gi.forceLightingRefresh();          // count change = arena refill in clustered mode, never a rebuild
});
gui.add(params, 'lightIntensity', 0, 40, 0.1).name('light intensity').onChange((v) => {
  for (const l of pointLights) l.intensity = v;
  gi.forceLightingRefresh();
});
gui.add(params, 'lightRange', 0, 20, 0.1).name('light range').onChange((v) => {
  for (const l of pointLights) l.distance = v;
  gi.forceLightingRefresh();          // the light lane would catch this within ~6 ticks; kick for instant response
});
gui.add(params, 'markers').name('light markers').onChange((v) => { if (markerMesh) markerMesh.visible = v; });
gui.add(params, 'giEnabled').name('GI enabled').onChange((v) => { gi.setEnabled(v); gi.markMaterialsDirty(); });
gui.add(params, 'giIntensity', 0, 60, 0.5).name('GI intensity').onChange((v) => gi.setIntensity(v));
gui.add(params, 'exposure', 0, 4, 0.01).name('exposure').onChange((v) => { renderer.toneMappingExposure = v; });

// ── Load Sponza ───────────────────────────────────────────────────────────────
function prepareSponzaMaterialForGi(material) {
  if (!material || material.userData?.powerlightGiPrepared) return;
  material.userData = material.userData || {};
  material.userData.powerlightGiPrepared = true;
  // This Sponza glTF imports with scalar metalness = 1 on stone/fabric surfaces.
  // SPEEDBALL GI intentionally kills diffuse bounce for metals, so normalize the
  // demo asset to dielectric before the spectral scene is packed.
  if (Number.isFinite(material.metalness) && material.metalness > 0.5) {
    material.metalness = 0;
    material.needsUpdate = true;
  }
  if (Number.isFinite(material.roughness) && material.roughness < 0.85) {
    material.roughness = 0.85;
    material.needsUpdate = true;
  }
}

setStatus('loading Sponza…');
new GLTFLoader().load('./Sponza/glTF/Sponza.gltf', (gltf) => {
  const sponza = gltf.scene;
  sponza.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = false;              // no shadow-casting lights in this demo
    o.receiveShadow = false;
    if (Array.isArray(o.material)) o.material.forEach(prepareSponzaMaterialForGi);
    else prepareSponzaMaterialForGi(o.material);
  });
  scene.add(sponza);

  const box = new THREE.Box3().setFromObject(sponza);
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  camera.near = radius * 0.01; camera.far = radius * 30; camera.updateProjectionMatrix();

  sponzaBounds = box;
  rebuildLights(params.lightCount);

  // model + lights are in the scene now → build the probe field over them.
  gi.requestRebuild();
  hideStatus();
}, (xhr) => {
  if (xhr.total) setStatus('loading Sponza… ' + Math.min(100, Math.round(xhr.loaded / xhr.total * 100)) + '%');
}, (err) => {
  setStatus('Failed to load ./Sponza/glTF/Sponza.gltf\n' + (err?.message || err), true);
});

window.demo = { params, rebuildLights };   // console handle for stress poking

// ── Render loop ───────────────────────────────────────────────────────────────
const monEl = document.getElementById('mon');
let fpsEma = 0, lastFrameT = 0, lastMonT = 0;
renderer.setAnimationLoop((nowMs) => {
  controls.update();
  gi?.update({ playing: false });      // idle-gated solve (camera-rest detection is built in)
  renderer.render(scene, camera);
  if (lastFrameT > 0) {
    const dt = nowMs - lastFrameT;
    if (dt > 0 && dt < 250) fpsEma = fpsEma > 0 ? fpsEma * 0.95 + dt * 0.05 : dt;
  }
  lastFrameT = nowMs;
  if (nowMs - lastMonT > 500) {
    lastMonT = nowMs;
    const arena = gi?._debugLightCount?.(0);
    monEl.textContent = `${fpsEma > 0 ? (1000 / fpsEma).toFixed(0) : '—'} fps · GI arena ${arena ?? '—'}/${pointLights.length}`;
  }
});
</script>
</body>
</html>
